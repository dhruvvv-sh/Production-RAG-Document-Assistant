[project]
name = "production-rag-document-assistant"
version = "0.1.0"
description = "A production-oriented, source-grounded PDF RAG service"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.7,<3",
    "psycopg[binary]>=3.2,<4",
    "pypdf>=5.1,<6",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "tiktoken>=0.8,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
